[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostproof-ai"
version = "0.1.0"
description = "GhostProof synthetic media inference pipelines"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "httpx>=0.27",
  "numpy>=1.26",
  "pydantic>=2.6",
  "uvicorn[standard]>=0.27"
]

[project.optional-dependencies]
vision = ["pillow>=10.0", "opencv-python-headless>=4.9"]
ml = ["onnxruntime>=1.17", "torch>=2.2", "transformers>=4.40"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.setuptools.packages.find]
include = ["ghostproof_ai*", "service*"]

[tool.ruff]
line-length = 100
target-version = "py311"
